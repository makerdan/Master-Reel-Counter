name: Managed Clerk production release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-clerk-production-release
  cancel-in-progress: false

jobs:
  require-trusted-main:
    name: Require trusted main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject untrusted release refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Managed Clerk release verification must run from refs/heads/main." >&2
            exit 1
          fi

  verify-managed-clerk:
    name: Verify published managed Clerk deployment
    needs:
      - require-trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Require safe published production URL
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_DEPLOYMENT_ID: ${{ vars.PRODUCTION_DEPLOYMENT_ID }}
        run: node scripts/validate-production-base-url.mjs

      - name: Install frozen dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require matched production Clerk publishable keys
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLERK_PUBLISHABLE_KEY" ]] || missing+=("CLERK_PUBLISHABLE_KEY")
          [[ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]] || missing+=("VITE_CLERK_PUBLISHABLE_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf 'Published managed Clerk validation is blocked: missing production publishable key %s.\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Verify currently published managed Clerk deployment
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          PRODUCTION_DEPLOYMENT_ID: ${{ vars.PRODUCTION_DEPLOYMENT_ID }}
          RELEASE_PUBLISHED_SMOKE_TARGET: ${{ vars.PRODUCTION_BASE_URL }}
          RELEASE_PUBLISHED_SMOKE_MODE: read-only
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run verify:managed-clerk-published

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-clerk-release-${{ github.run_id }}
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: false