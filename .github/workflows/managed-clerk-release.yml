name: Managed Clerk production release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-clerk-production-release
  cancel-in-progress: false

jobs:
  require-trusted-main:
    name: Require trusted main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject untrusted release refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Managed Clerk release verification must run from refs/heads/main." >&2
            exit 1
          fi

  verify-managed-clerk:
    name: Verify exact managed Clerk candidate
    needs:
      - require-trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: managed_clerk_release_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d managed_clerk_release_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require matched production Clerk credentials
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLERK_SECRET_KEY" ]] || missing+=("CLERK_SECRET_KEY")
          [[ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]] || missing+=("VITE_CLERK_PUBLISHABLE_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf 'Managed Clerk candidate validation is blocked: missing production credential %s.\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify exact managed Clerk production candidate
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/publication_guard_not_for_fixtures
          RELEASE_SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/managed_clerk_release_smoke
          RELEASE_CANDIDATE_ID: ${{ github.sha }}
        run: npm run release:build

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-clerk-release-${{ github.run_id }}
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 3
          include-hidden-files: false